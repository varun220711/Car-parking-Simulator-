name: Build & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app & sync Capacitor Android
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package release files
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/car-parking-simulator.apk
          cp dist/index.html release-artifacts/car-parking-simulator.html
          (cd dist && zip -r ../release-artifacts/car-parking-simulator-web.zip .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-parking-simulator-release
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Car Parking Simulator ${{ inputs.tag || github.ref_name }}
          body: |
            ### Downloads
            - **`car-parking-simulator.apk`** — Install directly on Android phones and tablets (allow "Install unknown apps" when prompted).
            - **`car-parking-simulator.html`** — Single-file browser version; download and open in any browser without a server.
            - **`car-parking-simulator-web.zip`** — Static web archive containing `index.html`.
          files: |
            release-artifacts/car-parking-simulator.apk
            release-artifacts/car-parking-simulator.html
            release-artifacts/car-parking-simulator-web.zip
